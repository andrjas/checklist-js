<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekend trip packing list</title>
  <script src="checklist.js" defer></script>
</head>
<body class="cl-page">
  <nav class="cl-nav"><a href="./">All checklists</a></nav>

  <!-- Hard-coded list: headings start groups, <li>s are items.
       Give each li a data-id if you plan to reword items later,
       so visitors' ticks are kept. -->
  <div data-checklist="packing" data-title="Weekend trip packing list" data-heading-level="1" data-editable>
    <h2>Documents</h2>
    <ul>
      <li data-id="passport">Passport or ID card</li>
      <li>Tickets and booking confirmations</li>
      <li>Travel insurance, <a href="https://www.example.com">policy number</a></li>
    </ul>

    <h2>Clothes</h2>
    <ul>
      <li>Underwear and socks</li>
      <li>Two shirts</li>
      <li>Rain jacket</li>
      <li>Comfortable shoes</li>
    </ul>

    <h2>Electronics</h2>
    <ul>
      <li>Phone charger</li>
      <li>Power bank</li>
      <li>Headphones</li>
    </ul>
  </div>
</body>
</html>
